# =============================================================================
# contigo-flow -- Helix process: design then (separately) Claude Code
# implementation. Ground truth: inputs/*.md (copied from docs/).
#
# TWO RUN TARGETS, split by a HUMAN checkpoint. governance.hitl is parsed and
# NOT enforced. require_approval: true always denies -- never set it. The
# stop-after-decomposition IS the fact that passata 1 is terminal and passata 2
# is a separate `helix run -o execution-fanout` that the operator launches.
#
#   PASSATA 1 -- contigo-design  docs → ALL ADRs → decomposition of ALL INDEX
#     ADRs (R0–R4, five epics) → slices. TERMINAL on DECOMPOSITION_OK:.
#     Re-run ONLY when inputs or architectural decisions change, with --fresh.
#   PASSATA 1b -- contigo-plan-r0-r4  leftover: append R1–R4 if tree was R0-only.
#   PASSATA 1c -- contigo-plan-close (DEFAULT)  checker ⇄ remediator. STOP.
#
#   PASSATA 2 -- execution-fanout over reports/plan/slice.current.yaml
#     Operator copies one slice: ./run.ps1 -Max -Slice r0-a -o execution-fanout
#     Worktrees of the local clone. on_orchestration_stop → PR to origin/main
#     on the *product* clone, then wave-close.md + HITL if open points remain.
#     Never fan-out the 103-task master. Studio green ≠ PR opened.
#
# Decomposer and remediator are chat+write_file, not Claude Code (PROCESS.md D9).
#
# MARKERS (all line-anchored):
#   CONTEXT_READY:  COUNCIL_FILES_WRITTEN:  COUNCIL_APPROVED:
#   DECOMPOSITION_OK: / DECOMPOSITION_GAPS:  REMEDIATION_DONE:
#   IMPLEMENTATION_GAPS:  IMPLEMENTATION_APPROVED:  HALTED:
# =============================================================================

version: "0.1"
runtime: maf
output_dir: reports

defaults:
  harness:
    memory: { scope: session }
    governance:
      # Opens the gate for execution-fanout's on_orchestration_stop commands
      # (open_fanout_pr.py, close_wave_slice.py). A command without this flag is SpecError.
      hooks: { allow_external: true }
      policy:
        model_allowlist:
          [deepseek-reasoning, deepseek-fast, coding-primary]

# -----------------------------------------------------------------------------
# Models -- names from .env. Unset ${VAR} = hard bind error.
# No temperature / top_p / max_tokens in options (ProviderError).
# extra_body.thinking.type=disabled: DeepSeek V4 (and deepseek-chat, which now
# aliases to it) enables thinking by default. After a tool call the API
# requires echoing reasoning_content; Helix does not. Disable thinking so
# intake/council/decomp tool loops do not 400.
#
# normalize_turns / tool_turn_cue default ON for local llama.cpp. On DeepSeek
# they orphan role=tool (relabel assistant+tool_calls → user, or insert a
# user cue between tool_calls and tool results) → HTTP 400
# "Messages with role 'tool' must be a response to a preceding message with
# 'tool_calls'". Both off. tool_call_content=ensure (DeepSeek is not Moonshot).
# -----------------------------------------------------------------------------
models:
  - id: deepseek-reasoning
    provider: openai
    model: ${DEEPSEEK_REASONING_MODEL}
    options:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      api: chat_completions
      context_window_tokens: 786432
      max_output_tokens: 65536
      tool_call_content: ensure
      normalize_turns: false
      tool_turn_cue: false
      timeout: 900
      max_retries: 2
      extra_body:
        thinking:
          type: disabled

  - id: deepseek-fast
    provider: openai
    model: ${DEEPSEEK_FAST_MODEL}
    options:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      api: chat_completions
      context_window_tokens: 786432
      max_output_tokens: 65536
      tool_call_content: ensure
      normalize_turns: false
      tool_turn_cue: false
      timeout: 900
      max_retries: 2
      extra_body:
        thinking:
          type: disabled

  # Lineage only -- not a chat client. Concrete Sonnet id so implementer /
  # reviewer / conflict-fixer do not inherit ~/.claude settings.json (haiku).
  - id: coding-primary
    provider: claude-code
    model: claude-sonnet-5

# -----------------------------------------------------------------------------
# Tools -- native registry is artifact-relative; `..` is refused.
# -----------------------------------------------------------------------------
tools:
  - { id: read-file,    kind: function, ref: read_file }
  - { id: read-files,   kind: function, ref: read_files }
  - { id: list-dir,     kind: function, ref: list_dir }
  - { id: glob-files,   kind: function, ref: glob }
  - { id: grep-files,   kind: function, ref: grep }
  - { id: write-file,   kind: function, ref: write_file }
  - { id: shell,        kind: function, ref: bash }

skills:
  - { id: kb-contract,             instructions_file: skills/kb-contract.md }
  - { id: marker-discipline,       instructions_file: skills/marker-discipline.md }
  - { id: council-protocol,        instructions_file: skills/council-protocol.md }
  - { id: product-owner-lane,      instructions_file: skills/product-owner-lane.md }
  - { id: architect-lane,          instructions_file: skills/architect-lane.md }
  - { id: cloud-architect-lane,    instructions_file: skills/cloud-architect-lane.md }
  - { id: security-architect-lane, instructions_file: skills/security-architect-lane.md }
  - { id: client-architect-lane,   instructions_file: skills/client-architect-lane.md }
  - { id: delivery-lane,           instructions_file: skills/delivery-lane.md }
  - { id: decompose-workitems,     instructions_file: skills/decompose-workitems.md }
  - { id: wavespec-schema,         instructions_file: skills/wavespec-schema.md }
  - { id: afi,                     instructions_file: skills/afi.md }
  - { id: readme-hygiene,          instructions_file: skills/readme-hygiene.md }

# -----------------------------------------------------------------------------
# Agents
# -----------------------------------------------------------------------------
agents:

  - id: docs-ingester
    model: deepseek-fast
    skills: [kb-contract, marker-discipline]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/docs-ingester.md

  - id: product-owner
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, product-owner-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/product-owner.md

  - id: software-architect
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, architect-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/software-architect.md

  - id: cloud-architect
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, cloud-architect-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/cloud-architect.md

  - id: security-architect
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, security-architect-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/security-architect.md

  - id: client-architect
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, client-architect-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/client-architect.md

  - id: delivery-manager
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, council-protocol, delivery-lane]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/delivery-manager.md

  # Critic only -- no write_file, no bash. Sole emitter of COUNCIL_APPROVED:.
  - id: council-gate
    model: deepseek-fast
    skills: [kb-contract, marker-discipline, council-protocol]
    tools: [read-file, read-files, list-dir, glob-files, grep-files]
    instructions_file: agents/council-gate.md

  # Chat + native write_file (PROCESS.md D9). Not Pattern E: a Claude Code
  # turn that writes the whole tree dies at CodingAgentTurnTimeout (600s).
  - id: backlog-decomposer
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, decompose-workitems, wavespec-schema]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file, shell]
    instructions_file: agents/backlog-decomposer.md

  - id: decomposition-checker
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, decompose-workitems, wavespec-schema]
    tools: [read-file, read-files, list-dir, glob-files, grep-files]
    instructions_file: agents/decomposition-checker.md

  # Chat + native write_file (PROCESS.md D9). Not Pattern E: a Claude Code
  # turn that rewrites many work-item files dies at CodingAgentTurnTimeout (600s).
  - id: decomposition-remediator
    model: deepseek-reasoning
    skills: [kb-contract, marker-discipline, decompose-workitems, wavespec-schema]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file, shell]
    instructions_file: agents/decomposition-remediator.md

  - id: implementer
    model: coding-primary  # Claude Sonnet (claude-sonnet-5)
    skills: [kb-contract, marker-discipline, afi, readme-hygiene]
    instructions_file: agents/implementer.md
    harness:
      backend: { kind: external-coding-agent, provider: claude-code, mode: harness, transport: agent-sdk }
      coding_agent:
        permission_mode: acceptEdits
        allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
        max_turns: 120

  - id: reviewer
    model: coding-primary
    skills: [kb-contract, marker-discipline, afi, readme-hygiene]
    instructions_file: agents/reviewer.md
    harness:
      backend: { kind: external-coding-agent, provider: claude-code, mode: harness, transport: agent-sdk }
      coding_agent:
        permission_mode: acceptEdits
        allowed_tools: [Read, Grep, Glob, Bash]
        max_turns: 60

  - id: conflict-fixer
    model: coding-primary
    skills: [kb-contract, readme-hygiene]
    instructions_file: agents/conflict-fixer.md
    harness:
      backend: { kind: external-coding-agent, provider: claude-code, mode: harness, transport: agent-sdk }
      coding_agent:
        permission_mode: acceptEdits
        allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
        max_turns: 40

# -----------------------------------------------------------------------------
# Orchestrations
# -----------------------------------------------------------------------------
orchestrations:

  # --- intake ----------------------------------------------------------------
  - id: docs-intake
    topology: sequential
    participants: [docs-ingester]

  # --- architecture council --------------------------------------------------
  # Independent lanes: each specialist in its own sequential, then concurrent
  # so no one has read the others. Then council-close reconciles.
  - id: lane-product-owner
    topology: sequential
    participants: [product-owner]

  - id: lane-software-architect
    topology: sequential
    participants: [software-architect]

  - id: lane-cloud-architect
    topology: sequential
    participants: [cloud-architect]

  - id: lane-security-architect
    topology: sequential
    participants: [security-architect]

  - id: lane-client-architect
    topology: sequential
    participants: [client-architect]

  - id: lane-delivery-manager
    topology: sequential
    participants: [delivery-manager]

  - id: architecture-lanes
    topology: concurrent
    aggregator: concat
    participants:
      - lane-product-owner
      - lane-software-architect
      - lane-cloud-architect
      - lane-security-architect
      - lane-client-architect
      - lane-delivery-manager

  - id: council-close
    topology: group_chat
    participants:
      - product-owner
      - software-architect
      - cloud-architect
      - security-architect
      - client-architect
      - delivery-manager
      - council-gate
    selection: round_robin
    # 4 table rounds x 7 participants = 28 turns.
    max_rounds: 28
    termination: on_marker
    marker: "COUNCIL_APPROVED:"
    marker_line_anchored: true
    close_requires_glob: "reports/architecture/*.md"
    close_requires_marker: "COUNCIL_FILES_WRITTEN:"
    limits: { max_identical_turns: 3 }

  - id: architecture-council
    topology: sequential
    participants: [architecture-lanes, council-close]

  # --- decomposition + Pattern F gate loop -----------------------------------
  - id: decomposition
    topology: sequential
    participants: [backlog-decomposer]

  - id: decomposition-check
    topology: sequential
    participants: [decomposition-checker]

  - id: decomposition-remediation
    topology: sequential
    participants: [decomposition-remediator]

  # ===========================================================================
  # PASSATA 1 -- docs → all ADRs → full R0–R4 tree. Use --fresh to re-analyse.
  # Does not reset ADRs by itself (pathlib glob would delete INDEX). --fresh
  # wipes reports/ then this workflow rebuilds context, ADRs, workitems, slices.
  # DECOMPOSITION_OK: has no outgoing edge — workflow ends. Operator launches
  # execution-fanout by hand.
  # ===========================================================================
  - id: contigo-design
    topology: workflow
    participants:
      - docs-intake
      - architecture-council
      - decomposition
      - decomposition-check
      - decomposition-remediation
    start: docs-intake
    # Never reset ADRs or context: pathlib glob reports/architecture/*.md
    # deletes INDEX + ADR-*.md at run start. Use --fresh for a true wipe.
    edges:
      - [docs-intake, architecture-council]
      - [architecture-council, decomposition]
      - [decomposition, decomposition-check]
      - [decomposition-check, decomposition-remediation, needs_remediation]
      - [decomposition-remediation, decomposition-check]
      # decomposition_complete: no edge. Passata 1 is terminal here.
    # max_steps = streamed-chunk cap for the WHOLE passata (council + many
    # write_file rounds). Not turns. DeepSeek token streams burn this fast;
    # 60000 died mid-run (MaxStepsExceeded). Cycle brake is max_iterations.
    # run_timeout_s default is 4 h — too tight for this chain.
    limits: { max_steps: 500000, max_iterations: 25, run_timeout_s: 28800 }

  # Leftover from the R0-only first execution. Prefer contigo-design --fresh
  # when ADRs change. Use this only to append epic-02..05 without re-council.
  - id: contigo-plan-r0-r4
    topology: workflow
    participants:
      - decomposition
      - decomposition-check
      - decomposition-remediation
    start: decomposition
    edges:
      - [decomposition, decomposition-check]
      - [decomposition-check, decomposition-remediation, needs_remediation]
      - [decomposition-remediation, decomposition-check]
      # decomposition_complete: no edge. Operator launches execution-fanout.
    limits: { max_steps: 800000, max_iterations: 25, run_timeout_s: 28800 }

  # DEFAULT. Tree already on disk (R0–R4). Wave-spec may still be R0-only.
  # Starts at the checker: DECOMPOSITION_GAPS: → remediator patches the plan.
  # DECOMPOSITION_OK: ends the run. Does not re-run the decomposer or the council.
  - id: contigo-plan-close
    default: true
    topology: workflow
    participants:
      - decomposition-check
      - decomposition-remediation
    start: decomposition-check
    edges:
      - [decomposition-check, decomposition-remediation, needs_remediation]
      - [decomposition-remediation, decomposition-check]
      # decomposition_complete: no edge. Operator launches execution-fanout.
    # remediator write_file + checker loop burned 400000
    # (MaxStepsExceeded). Cycle brake is max_iterations, not this cap.
    limits: { max_steps: 800000, max_iterations: 25, run_timeout_s: 28800 }

  # ===========================================================================
  # PASSATA 2 -- not reachable from contigo-design.
  # Workflow, not group_chat. HALTED: from implementer skips the reviewer.
  # HALTED: from reviewer has no back-edge. Either ends THIS task immediately.
  # The engine has NO halt-guard for a workflow instance: the run ends as a
  # normal stop (stop_reason no_edge_matched). fan_out.task_failure_markers
  # below is what turns that HALTED: last line into a failed task -- e13 (run
  # 5dec6283) counted three HALTED tasks as delivered before it existed.
  # IMPLEMENTATION_GAPS: is the only loop-back. IMPLEMENTATION_APPROVED: has
  # no outgoing edge (success). Do NOT use on_approved_or_halted (unanchored
  # substring APPROVED:). Do NOT use halt-wave (would kill independent tasks).
  # ===========================================================================
  - id: execution-loop
    topology: workflow
    participants: [implementer, reviewer]
    start: implementer
    edges:
      - from: implementer
        to: reviewer
        condition: on_marker_absent
        marker: "HALTED:"
      - from: reviewer
        to: implementer
        condition: on_marker
        marker: "IMPLEMENTATION_GAPS:"
    limits: { max_iterations: 10, max_steps: 800000, run_timeout_s: 14400 }

  - id: merge-resolve
    topology: sequential
    participants: [conflict-fixer]

  - id: contigo-execution
    topology: sequential
    participants: [execution-loop]

  # isolation: git-worktree + base_branch: main -- ambient-repo of the LOCAL
  # clone (git toplevel walked up from this artifact). Dedicated-run-repo
  # (no base_branch) would root at output_dir `reports/` and hide infra/.
  # run.ps1/run.sh call ensure_artifact_git when this folder is not already
  # its own toplevel (otherwise Helix worktrees helix-artifacts).
  # max_parallel: 3 is the DAG width ceiling after auto_level_phases.
  # over MUST exist at validate time -- do not delete the placeholder.
  # fan_out.write_back is INERT. The PR is orchestrations[].hooks
  # on_orchestration_stop (success path only; error → on_orchestration_error).
  - id: execution-fanout
    hooks:
      - event: on_orchestration_start
        command: scripts/check_seed_freshness.py
        # Observation-only: warns if integration is ahead of main (stale seed trap).
        # Path only — Helix validates command as an artifact-relative file
        # (Windows runner wraps .py with python).
        timeout_s: 15
      - event: on_orchestration_start
        command: scripts/check_single_writer.py
        # Observation-only here (hooks are fail-open): prints same-phase file
        # collisions of slice.current.yaml to stderr. The fail-closed gate is
        # `python scripts/check_slice_prereqs.py --slice <id>` before launch.
        timeout_s: 30
      - event: on_orchestration_stop
        command: scripts/open_fanout_pr.py
        # Hard cap in helix.hooks.external is 60s (git push + gh).
        timeout_s: 60
      - event: on_orchestration_stop
        command: scripts/close_wave_slice.py
        timeout_s: 60
    fan_out:
      # One slice wave-spec, not the 103-task master. run.ps1 -Slice copies
      # reports/plan/slices/<id>.yaml here before helix run.
      over: reports/plan/slice.current.yaml
      instance: execution-loop
      isolation: git-worktree
      base_branch: main
      integration_branch: integration
      max_parallel: 3
      # 3: Connection lost mid-response is TRANSIENT (Helix wraps ResultError);
      # genuine IMPLEMENTATION_GAPS stay TERMINAL and do not consume retries.
      max_task_attempts: 3
      auto_level_phases: true
      merge_between_phases: true
      merge_auto: true
      merge_resolver: merge-resolve
      merge_verify: python .helix/scripts/merge_verify.py
      salvage_uncommitted: true
      on_task_failure: block-dependents
      # HALTED: fails this task only (engine outcome `halted`). block-dependents
      # skips tasks whose depends_on intersects this produces; independent
      # tasks in the same wave still run. halt-wave would kill the slice.
      # Passata 2 bills Claude Code Max (claude login), not Console API.
      # resume_completed skips tasks whose wave/* branch carries committed work
      # beyond its FORK POINT (refs/helix/fork/<branch>; the reflog creation
      # entry for older branches) -- never "diffs vs main", which is true of
      # every phase >= 2 branch the moment it is created. To force a re-run of
      # a delivered task, delete its wave/* branch.
      resume_completed: true
      # Delivery contract (Helix 2026-09-09). A task is delivered ONLY when its
      # wave/<task> branch carries committed work beyond its fork point. An
      # implementer that HALTED, a reviewer that closed without a verdict, a
      # turn that died before `git commit`: FAILED, dependents blocked, listed
      # in reports/execution/wave-close.md with its salvage/* tags. e13 (run
      # 5dec6283) reported 20/20 finished with five such tasks.
      require_delivery: true
      # Last non-blank line of the instance output, line-anchored. HALTED: ends
      # the workflow as a normal stop; this records the task as failed.
      task_failure_markers: ["HALTED:"]
