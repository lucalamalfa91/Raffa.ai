# =============================================================================
# contigo-ask-process -- Helix Passata 1 for ASK SAVINGS COPILOT only.
# Does NOT replace contigo-process.yaml. Launch with ./run-ask.ps1
# (never --fresh, never -Slice / execution-fanout).
#
# PASSATA 1 -- contigo-ask-design (DEFAULT)
#   docs-intake-ask → ask-adr-gate → decomposer → checker ⇄ remediator.
#   Amends ADR-001/004/011/018/020, writes ADR-023, wave-spec.ask.yaml, e12.yaml.
#   Never touches wave-spec.execution.yaml, e01–e11, e1011, or slice.current.yaml.
#
# PASSATA 2 is NOT in this document. After HITL on the ADRs + gap report:
#   ./run.ps1 -Max -Slice e12 -o execution-fanout
# =============================================================================

version: "0.1"
runtime: maf
output_dir: reports

defaults:
  harness:
    memory: { scope: session }
    governance:
      hooks: { allow_external: false }
      policy:
        model_allowlist: [deepseek-reasoning, deepseek-fast]

models:
  - id: deepseek-reasoning
    provider: openai
    model: ${DEEPSEEK_REASONING_MODEL}
    options:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      api: chat_completions
      context_window_tokens: 786432
      max_output_tokens: 65536
      tool_call_content: ensure
      normalize_turns: false
      tool_turn_cue: false
      timeout: 900
      max_retries: 2
      extra_body:
        thinking:
          type: disabled

  - id: deepseek-fast
    provider: openai
    model: ${DEEPSEEK_FAST_MODEL}
    options:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      api: chat_completions
      context_window_tokens: 786432
      max_output_tokens: 65536
      tool_call_content: ensure
      normalize_turns: false
      tool_turn_cue: false
      timeout: 900
      max_retries: 2
      extra_body:
        thinking:
          type: disabled

tools:
  - { id: read-file,    kind: function, ref: read_file }
  - { id: read-files,   kind: function, ref: read_files }
  - { id: list-dir,     kind: function, ref: list_dir }
  - { id: glob-files,   kind: function, ref: glob }
  - { id: grep-files,   kind: function, ref: grep }
  - { id: write-file,   kind: function, ref: write_file }
  - { id: shell,        kind: function, ref: bash }

skills:
  - { id: kb-contract,                 instructions_file: skills/kb-contract.md }
  - { id: kb-contract-ask,             instructions_file: skills/kb-contract-ask.md }
  - { id: marker-discipline,           instructions_file: skills/marker-discipline.md }
  - { id: council-protocol-ask,        instructions_file: skills/council-protocol-ask.md }
  - { id: decompose-ask-workitems,     instructions_file: skills/decompose-ask-workitems.md }
  - { id: wavespec-ask,                instructions_file: skills/wavespec-ask.md }

agents:
  - id: docs-ingester-ask
    model: deepseek-fast
    skills: [kb-contract, kb-contract-ask, marker-discipline]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/docs-ingester-ask.md

  - id: ask-auditor
    model: deepseek-reasoning
    skills: [kb-contract, kb-contract-ask, marker-discipline, council-protocol-ask]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file]
    instructions_file: agents/ask-auditor.md

  - id: ask-critic
    model: deepseek-fast
    skills: [kb-contract, kb-contract-ask, marker-discipline, council-protocol-ask]
    tools: [read-file, read-files, list-dir, glob-files, grep-files]
    instructions_file: agents/ask-critic.md

  - id: backlog-decomposer-ask
    model: deepseek-reasoning
    skills: [kb-contract, kb-contract-ask, marker-discipline, decompose-ask-workitems, wavespec-ask]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file, shell]
    instructions_file: agents/backlog-decomposer-ask.md

  - id: decomposition-checker-ask
    model: deepseek-reasoning
    skills: [kb-contract, kb-contract-ask, marker-discipline, decompose-ask-workitems, wavespec-ask]
    tools: [read-file, read-files, list-dir, glob-files, grep-files]
    instructions_file: agents/decomposition-checker-ask.md

  - id: decomposition-remediator-ask
    model: deepseek-reasoning
    skills: [kb-contract, kb-contract-ask, marker-discipline, decompose-ask-workitems, wavespec-ask]
    tools: [read-file, read-files, list-dir, glob-files, grep-files, write-file, shell]
    instructions_file: agents/decomposition-remediator-ask.md

orchestrations:
  - id: docs-intake-ask
    topology: sequential
    participants: [docs-ingester-ask]

  - id: ask-adr-gate
    topology: group_chat
    participants: [ask-auditor, ask-critic]
    selection: round_robin
    max_rounds: 12
    termination: on_marker
    marker: "ASK_ADRS_APPROVED:"
    marker_line_anchored: true
    close_requires_glob: "reports/architecture/ADR-023*.md"
    close_requires_marker: "ASK_ADRS_WRITTEN:"
    limits: { max_identical_turns: 3 }

  - id: decomposition-ask
    topology: sequential
    participants: [backlog-decomposer-ask]

  - id: decomposition-check-ask
    topology: sequential
    participants: [decomposition-checker-ask]

  - id: decomposition-remediation-ask
    topology: sequential
    participants: [decomposition-remediator-ask]

  - id: contigo-ask-design
    default: true
    topology: workflow
    participants:
      - docs-intake-ask
      - ask-adr-gate
      - decomposition-ask
      - decomposition-check-ask
      - decomposition-remediation-ask
    start: docs-intake-ask
    edges:
      - [docs-intake-ask, ask-adr-gate]
      - [ask-adr-gate, decomposition-ask]
      - [decomposition-ask, decomposition-check-ask]
      - [decomposition-check-ask, decomposition-remediation-ask, needs_remediation]
      - [decomposition-remediation-ask, decomposition-check-ask]
    limits: { max_steps: 200000, max_iterations: 15, run_timeout_s: 14400 }
