name: infra

# ADR-014 (per-folder deploy jobs, path filters, trunk-based main -> dev
# auto-deploy) and ADR-007 (Terraform layout: reusable modules + two thin
# environment roots, remote state per env via HCP Terraform). Path-filtered
# to infra/ only, so a backend/web/mobile-only change never runs this
# workflow and vice versa (parent story us-02 AC-1).
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  # us-03's demo promotion workflow (ADR-016) reuses this same plan
  # (and the VCS-apply pointer job) by calling it with
  # target_environment: demo. dev and demo never
  # share state or backend (ADR-007) -- only the job *definition* is
  # shared; TF_ROOT below resolves to a different environment root/HCP
  # workspace per call.
  workflow_call:
    inputs:
      target_environment:
        description: >-
          Terraform environment root to plan/apply: "dev" or "demo".
          Defaults to "dev", which is all this task (us-02) wires up.
        required: false
        type: string
        default: dev

# Least privilege by default. Neither job below requests `id-token`: see
# the comment on the plan job for why Azure OIDC is not part of this
# workflow.
permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.target_environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a run mid-plan; HCP owns apply

env:
  TF_ENVIRONMENT: ${{ inputs.target_environment || 'dev' }}
  TF_ROOT: infra/environments/${{ inputs.target_environment || 'dev' }}
  TF_IN_AUTOMATION: "true"

jobs:
  # Required status check for the protected `main` branch (ADR-014
  # "status checks required (the per-folder CI jobs)"). No Azure or HCP
  # credentials are needed for fmt/validate, so this runs unconditionally
  # on every PR that touches infra/.
  validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: terraform init (no backend -- syntax/config only)
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

  # Plans against the real HCP Terraform workspace for TF_ENVIRONMENT
  # ("raffa-dev" / "raffa-demo", ADR-007, backend.tf per environment
  # root). Runs on PRs too (read-only) so a plan is visible before merge.
  plan:
    name: terraform plan (${{ inputs.target_environment || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          # HCP Terraform's own API token (organization raffa-platform).
          # This is *not* an Azure credential and is outside ADR-015's
          # "CI -> Azure auth" scope -- it authenticates the CLI to the HCP
          # Terraform API/backend, nothing more.
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false

  # Merge-to-main / demo-promote gate only. Both HCP workspaces are
  # VCS-connected (scripts/hcp_vcs_wiring.py, ADR-007): HCP itself runs
  # plan/apply from the GitHub repo. A CLI `terraform apply` from this
  # runner is rejected ("Apply not allowed for workspaces with a VCS
  # connection"), so this job does not invoke Terraform. Confirm the
  # VCS-triggered run in the HCP UI (or enable workspace auto-apply).
  # The job is still gated on push to main / workflow_call and still
  # sets `environment:` so AC-2 and demo-promote's environment: demo
  # approval keep working. Azure OIDC is not used here: ARM_* live on
  # the HCP workspace.
  apply:
    name: terraform apply skipped (${{ inputs.target_environment || 'dev' }})
    needs: plan
    # Reusable workflows inherit the caller's event (a demo-v* tag push is
    # still `push` + `refs/tags/demo-v*`, not `workflow_call` + `main`).
    if: github.event_name == 'workflow_call' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/demo-v')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'dev' }}
    steps:
      - name: HCP VCS owns apply
        env:
          TF_WORKSPACE: raffa-${{ env.TF_ENVIRONMENT }}
        run: |
          set -euo pipefail
          {
            echo "### Infra apply is owned by HCP Terraform (VCS)"
            echo ""
            echo "Workspace \`$TF_WORKSPACE\` is VCS-connected. Confirm the run at:"
            echo "https://app.terraform.io/app/raffa-platform/workspaces/$TF_WORKSPACE/runs"
            echo ""
            echo "Do not run \`terraform apply\` from GitHub Actions against a VCS-connected workspace."
          } >> "$GITHUB_STEP_SUMMARY"
