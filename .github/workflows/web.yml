name: web

# ADR-014 (per-folder deploy jobs, path filters, main -> dev auto-deploy)
# and ADR-012 (React + TypeScript + Vite SPA, static bundle on Azure
# Static Web Apps free tier): "CI/CD must add a web/ path-filtered job
# that runs npm ci, npm run build, and deploys the static output to the
# per-environment Static Web App." Path-filtered to web/ only (parent
# story us-02 AC-1).
on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/azure-login/**"
      - "scripts/write_web_runtime_config.py"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/azure-login/**"
      - "scripts/write_web_runtime_config.py"
  # us-03's demo promotion workflow (ADR-016) reuses this deploy job by
  # calling it with target_environment: demo, under the demo CI identity
  # and demo Static Web App (ADR-015). dev and demo never share a resource
  # group or service principal -- only the job definition is shared.
  workflow_call:
    inputs:
      target_environment:
        description: >-
          GitHub Environment (and Azure resource-group / CI-identity
          suffix) to deploy to: "dev" or "demo". Defaults to "dev", which
          is all this task (us-02) wires up.
        required: false
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: web-${{ inputs.target_environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'dev' }}

jobs:
  # Required status check for the protected `main` branch (ADR-014).
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cache-dependency-path: web/ has no package-lock.json until the
      # client-scaffold task lands (only .gitkeep today). setup-node's
      # cache hashes that lockfile and hard-errors if it can't find one --
      # pointing it at a path that doesn't exist yet would break this
      # workflow before that scaffold exists. Re-add `cache: npm` once
      # web/package-lock.json is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # web/ is scaffolded by a separate client-scaffold task (ADR-012 is
      # decided; the React+Vite app itself is not this task's file scope).
      # --if-present keeps this workflow valid before that scaffold lands,
      # and a no-op once web/ exists but a given script isn't defined yet.
      - name: npm ci
        working-directory: web
        run: npm ci --if-present

      - name: npm run build
        working-directory: web
        run: npm run build --if-present

      - name: npm test
        working-directory: web
        run: npm test --if-present

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7

  # Deploys on merge to main (AC-2) or when reused by the demo promotion
  # workflow.
  deploy:
    name: deploy (${{ inputs.target_environment || 'dev' }})
    needs: build
    # Reusable workflows inherit the caller's event (a demo-v* tag push is
    # still `push` + `refs/tags/demo-v*`, not `workflow_call` + `main`).
    if: github.event_name == 'workflow_call' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/demo-v')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'dev' }}
    permissions:
      id-token: write # required so GitHub issues the OIDC token azure/login exchanges
      contents: read
    steps:
      # Local composite actions (./.github/actions/...) need the repo on
      # disk; download-artifact alone leaves the workspace empty.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # OIDC auth step (ADR-015): azure/login with only the non-secret
      # client-id/tenant-id/subscription-id of this environment's
      # least-privilege deploy service principal. vars.* resolve from
      # this job's `environment:`, so dev and demo each read their own
      # service principal's identity.
      - name: Azure login (OIDC)
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Static Web Apps' classic deploy action wants a stored deployment
      # token (a long-lived secret) -- ADR-015 ("no secrets in code, client
      # bundles ... no stored secret; the only credential material is the
      # OIDC trust relationship") rules that out. Instead this fetches a
      # deployment token live, via the OIDC-authenticated `az` session, and
      # never persists it: masked in logs, used once, not written to disk,
      # not a GitHub secret.
      #
      # SWA name is composed like backend.yml's Container Apps
      # (ca-raffa-<env>-api): infra/modules/staticwebapp names the
      # resource swa-raffa-<env>. No GitHub Environment variable.
      - name: Ensure Azure CLI extensions
        run: |
          az extension add --name staticwebapp --upgrade -y
          az extension add --name containerapp --upgrade -y

      # ADR-012 "config, not code": the build job uploads one web-dist for
      # both envs. Overwrite dist/config.json here with this environment's
      # live (non-secret) API origin + OIDC values before swa-cli deploy.
      - name: Write per-environment config.json
        env:
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          RG="rg-raffa-${TARGET_ENVIRONMENT}"
          SWA_NAME="swa-raffa-${TARGET_ENVIRONMENT}"
          API_NAME="ca-raffa-${TARGET_ENVIRONMENT}-api"
          UAI_NAME="id-raffa-${TARGET_ENVIRONMENT}-workload"
          HCP_RUNS="https://app.terraform.io/app/raffa-platform/workspaces/raffa-${TARGET_ENVIRONMENT}/runs"
          if [[ ! -f web/dist/config.json ]]; then
            echo "::error::web/dist/config.json is missing from the web-dist artifact"
            exit 1
          fi
          if [[ -z "${TENANT_ID}" ]]; then
            echo "::error::GitHub Environment variable AZURE_TENANT_ID is empty"
            exit 1
          fi
          if ! az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "::error::$SWA_NAME was not found in $RG. Confirm the HCP VCS apply for workspace raffa-${TARGET_ENVIRONMENT} at $HCP_RUNS, wait until it is CURRENT, then re-run this job."
            exit 1
          fi
          # CLI `show` flattens some resources (SWA defaultHostname) and
          # keeps ARM shape on others. Prefer az resource show (always
          # properties.*) then fall back so the same job works for
          # TARGET_ENVIRONMENT=dev and demo.
          SWA_HOST=$(az resource show --resource-group "$RG" --name "$SWA_NAME" \
            --resource-type Microsoft.Web/staticSites \
            --query "properties.defaultHostname" -o tsv | tr -d '\r')
          if [[ -z "$SWA_HOST" ]]; then
            SWA_HOST=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" \
              --query "defaultHostname || properties.defaultHostname" -o tsv | tr -d '\r')
          fi
          API_FQDN=$(az resource show --resource-group "$RG" --name "$API_NAME" \
            --resource-type Microsoft.App/containerApps \
            --query "properties.configuration.ingress.fqdn || properties.latestRevisionFqdn" -o tsv | tr -d '\r')
          if [[ -z "$API_FQDN" ]]; then
            API_FQDN=$(az containerapp show --name "$API_NAME" --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn || configuration.ingress.fqdn || properties.latestRevisionFqdn || latestRevisionFqdn" -o tsv | tr -d '\r')
          fi
          CLIENT_ID=$(az identity show --name "$UAI_NAME" --resource-group "$RG" \
            --query "tags.oidcPublicClientId" -o tsv | tr -d '\r')
          if [[ -z "$SWA_HOST" ]]; then
            echo "::error::could not resolve defaultHostname for $SWA_NAME in $RG. Confirm the HCP VCS apply at $HCP_RUNS, then re-run this job."
            exit 1
          fi
          if [[ -z "$API_FQDN" ]]; then
            echo "::error::could not resolve ingress FQDN for $API_NAME in $RG. Confirm the HCP VCS apply at $HCP_RUNS, then re-run this job."
            exit 1
          fi
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::$UAI_NAME is missing tag oidcPublicClientId. Confirm the HCP VCS apply at $HCP_RUNS (modules/identity tags the workload identity with the public-client app id), then re-run this job."
            exit 1
          fi
          python3 scripts/write_web_runtime_config.py \
            --out web/dist/config.json \
            --api-base-url "https://${API_FQDN}" \
            --oidc-authority "https://login.microsoftonline.com/${TENANT_ID}" \
            --oidc-client-id "$CLIENT_ID" \
            --oidc-redirect-uri "https://${SWA_HOST}/" \
            --oidc-api-scope "api://raffa-${TARGET_ENVIRONMENT}-api/Raffa.Read" \
            --oidc-api-scope "api://raffa-${TARGET_ENVIRONMENT}-api/Raffa.Write"

      - name: Deploy to Azure Static Web Apps
        run: |
          set -euo pipefail
          RG="rg-raffa-${TARGET_ENVIRONMENT}"
          SWA_NAME="swa-raffa-${TARGET_ENVIRONMENT}"
          HCP_RUNS="https://app.terraform.io/app/raffa-platform/workspaces/raffa-${TARGET_ENVIRONMENT}/runs"
          DEPLOY_TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RG" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::no deploy token for $SWA_NAME in $RG — confirm the HCP VCS apply at $HCP_RUNS, then re-run this job"
            exit 1
          fi
          echo "::add-mask::$DEPLOY_TOKEN"
          npx --yes @azure/static-web-apps-cli deploy web/dist \
            --deployment-token "$DEPLOY_TOKEN" \
            --env production
