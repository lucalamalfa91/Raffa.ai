name: backend

# ADR-014 (per-folder deploy jobs, path filters, main -> dev auto-deploy),
# ADR-002 (.NET modular monolith: thin Api + Worker hosts), ADR-005
# (Container Apps Environment + api/worker Container Apps + ACR).
# Path-filtered to backend/ only (parent story us-02 AC-1).
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/azure-login/**"
      - "scripts/pg_connection_string_env.py"
      - "scripts/schema_apply_verify.py"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/azure-login/**"
      - "scripts/pg_connection_string_env.py"
      - "scripts/schema_apply_verify.py"
  # us-03's demo promotion workflow (ADR-016) reuses this deploy job by
  # calling it with target_environment: demo, under the demo CI identity
  # and demo resource group (ADR-015). dev and demo never share a resource
  # group or service principal -- only the job definition is shared.
  workflow_call:
    inputs:
      target_environment:
        description: >-
          GitHub Environment (and Azure resource-group / CI-identity
          suffix) to deploy to: "dev" or "demo". Defaults to "dev", which
          is all this task (us-02) wires up.
        required: false
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: backend-${{ inputs.target_environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'dev' }}

jobs:
  # Required status check for the protected `main` branch (ADR-014).
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        working-directory: backend
        run: dotnet restore Contigo.slnx

      - name: dotnet build
        working-directory: backend
        run: dotnet build Contigo.slnx --configuration Release --no-restore

      - name: dotnet test
        working-directory: backend
        run: dotnet test Contigo.slnx --configuration Release --no-build

  # Deploys on merge to main (AC-2) or when reused by the demo promotion
  # workflow. Rebuilds+pushes both container images then rolls each
  # Container App to the new tag; a future promotion redesign could instead
  # re-tag dev's already-verified image straight to demo -- left as a note
  # for us-03, not decided here.
  deploy:
    name: deploy (${{ inputs.target_environment || 'dev' }})
    needs: build
    # Reusable workflows inherit the caller's event (a demo-v* tag push is
    # still `push` + `refs/tags/demo-v*`, not `workflow_call` + `main`).
    if: github.event_name == 'workflow_call' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/demo-v')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'dev' }}
    permissions:
      id-token: write # required so GitHub issues the OIDC token azure/login exchanges
      contents: read
    steps:
      - uses: actions/checkout@v4

      # OIDC auth step (ADR-015): azure/login with only the non-secret
      # client-id/tenant-id/subscription-id of this environment's
      # least-privilege deploy service principal (contigo-sp-dev /
      # contigo-sp-demo, task E01/F03/US01/T01). No client secret, no
      # AZURE_CREDENTIALS. vars.* resolve from this job's `environment:`,
      # so dev and demo each read their own service principal's identity.
      - name: Azure login (OIDC)
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Resolve ACR for this environment
        run: |
          set -euo pipefail
          RG="rg-contigo-${TARGET_ENVIRONMENT}"
          ACR_NAME=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list --resource-group "$RG" --query "[0].loginServer" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::no Container Registry found in resource group $RG"
            exit 1
          fi
          echo "RESOURCE_GROUP=$RG" >> "$GITHUB_ENV"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      # ACR Tasks builds the image server-side in Azure -- no local Docker
      # daemon needed on the runner. The Dockerfiles below are the backend
      # containerization task's deliverable; these paths are the CI
      # contract those images must satisfy, not something this task
      # authors.
      - name: Build + push API image (az acr build)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "contigo-api:${{ github.sha }}" \
            --file backend/src/Contigo.Api/Dockerfile \
            backend

      - name: Build + push Worker image (az acr build)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "contigo-worker:${{ github.sha }}" \
            --file backend/src/Contigo.Worker/Dockerfile \
            backend

      # Container Apps pull from this env's ACR with the workload identity
      # (AcrPull + registry {} from modules/acr and modules/containerapps).
      # Bind the registry on the app before rolling the image so a promote
      # to demo does not 401 if HCP applied the role but the registry
      # attachment is not yet on the revision.
      # `az containerapp registry set` is a preview ARM write; Azure
      # InternalServerError-s on an already-attached registry (run
      # 34193057540, correlation 8fd7ffc4-bce2-4442-b9fb-3cb98fc5faf6).
      # Skip when the binding is already present; retry 5xx otherwise.
      - name: Attach ACR pull identity to Container Apps
        run: |
          set -euo pipefail
          UAI_NAME="id-contigo-${TARGET_ENVIRONMENT}-workload"
          UAI_ID=$(az identity show --name "$UAI_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          HCP_RUNS="https://app.terraform.io/app/contigo-platform/workspaces/contigo-${TARGET_ENVIRONMENT}/runs"
          if [[ -z "$UAI_ID" ]]; then
            echo "::error::could not resolve $UAI_NAME in $RESOURCE_GROUP. Confirm the HCP VCS apply at $HCP_RUNS, then re-run this job."
            exit 1
          fi
          for APP in api worker; do
            APP_NAME="ca-contigo-${TARGET_ENVIRONMENT}-${APP}"
            EXISTING_IDENTITY=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.registries[?server=='${ACR_LOGIN_SERVER}'].identity | [0]" \
              -o tsv || true)
            if [[ -n "$EXISTING_IDENTITY" && "${EXISTING_IDENTITY,,}" == "${UAI_ID,,}" ]]; then
              echo "$APP_NAME already pulls $ACR_LOGIN_SERVER with the workload identity — skip registry set."
              continue
            fi
            ATTEMPT=1
            MAX=5
            until az containerapp registry set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --server "$ACR_LOGIN_SERVER" \
              --identity "$UAI_ID"; do
              if [[ "$ATTEMPT" -ge "$MAX" ]]; then
                echo "::error::az containerapp registry set failed for $APP_NAME after $MAX attempts. Re-run this job."
                exit 1
              fi
              echo "registry set failed for $APP_NAME (attempt ${ATTEMPT}/${MAX}); retrying..."
              sleep $((ATTEMPT * 8))
              ATTEMPT=$((ATTEMPT + 1))
            done
          done

      # Container App names are fixed by infra/modules/containerapps
      # ("ca-contigo-<env>-api" / "-worker"); no random suffix, safe to
      # compose here from TARGET_ENVIRONMENT.
      - name: Deploy API Container App revision
        run: |
          az containerapp update \
            --name "ca-contigo-${TARGET_ENVIRONMENT}-api" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/contigo-api:${{ github.sha }}"

      - name: Deploy Worker Container App revision
        run: |
          az containerapp update \
            --name "ca-contigo-${TARGET_ENVIRONMENT}-worker" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/contigo-worker:${{ github.sha }}"

      # ADR-021: schema apply on deploy, after both Container Apps above are
      # already running the new image. Each module that owns a DbContext
      # checks in a `dotnet ef migrations script --idempotent` output (task
      # E09/F01/US01/T01, backend/src/<Module>/Migrations/Scripts/*.sql);
      # this job applies all six here, in ADR-021's fixed order.
      # Contigo.Api/Contigo.Worker deliberately never call
      # Database.MigrateAsync() (ADR-021 "Decision outcome"), so a replica
      # boot never mutates schema -- CI is the only apply path, for both
      # dev (this trigger) and demo (the same job, reused via
      # workflow_call by us-03's demo-promote.yml, target_environment: demo).
      - name: Install postgresql-client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

      # Key Vault name carries a random suffix (modules/keyvault:
      # kv-contigo-<env>-<6 chars>), same reason ACR's name is resolved
      # above instead of composed as a literal. The secret itself is
      # Npgsql-format (Host=...;Database=...;Username=...;Password=...;Ssl
      # Mode=Require) -- scripts/pg_connection_string_env.py is the one,
      # pure, unit-tested translation into the PG* environment variables
      # `psql` reads automatically; this step is the only place that
      # touches the raw secret value, and masks it (and the password it
      # carries) immediately after each is known.
      - name: Fetch Postgres connection string (ADR-021)
        run: |
          set -euo pipefail
          HCP_RUNS="https://app.terraform.io/app/contigo-platform/workspaces/contigo-${TARGET_ENVIRONMENT}/runs"
          KV_NAME=$(az keyvault list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$KV_NAME" ]; then
            echo "::error::no Key Vault found in resource group $RESOURCE_GROUP. Confirm the HCP VCS apply at $HCP_RUNS, then re-run this job."
            exit 1
          fi
          set +e
          RAW_CONN=$(az keyvault secret show --vault-name "$KV_NAME" --name postgres-connection --query value -o tsv 2>/tmp/kv_secret_show.err)
          KV_STATUS=$?
          set -e
          if [ $KV_STATUS -ne 0 ] || [ -z "$RAW_CONN" ]; then
            echo "::error::could not read secret 'postgres-connection' from $KV_NAME. Either the HCP VCS apply at $HCP_RUNS has not created it yet, or this environment's CI deploy principal (contigo-sp-${TARGET_ENVIRONMENT}) is missing the 'Key Vault Secrets User' role on $KV_NAME -- Contributor on the resource group does not include Key Vault data-plane access once rbac_authorization_enabled=true (infra/modules/keyvault/main.tf grants that role to the workload identity only, not the CI principal; see infra/README.md Known gaps). Azure CLI said: $(tail -c 500 /tmp/kv_secret_show.err | tr '\n' ' ')"
            exit 1
          fi
          echo "::add-mask::$RAW_CONN"
          PG_EXPORTS=$(printf '%s' "$RAW_CONN" | python3 scripts/pg_connection_string_env.py)
          eval "$PG_EXPORTS"
          echo "::add-mask::$PGPASSWORD"
          if [ -z "${PGHOST:-}" ] || [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::scripts/pg_connection_string_env.py produced an incomplete environment from the postgres-connection secret"
            exit 1
          fi
          {
            echo "PGHOST=$PGHOST"
            echo "PGPORT=$PGPORT"
            echo "PGDATABASE=$PGDATABASE"
            echo "PGUSER=$PGUSER"
            echo "PGPASSWORD=$PGPASSWORD"
            echo "PGSSLMODE=$PGSSLMODE"
          } >> "$GITHUB_ENV"

      - name: Apply schema (ADR-021)
        run: |
          set -euo pipefail
          # Fixed order (ADR-021 "Decision outcome"). Keep this array in
          # lockstep with the identical one in "Verify schema applied" below.
          SCRIPTS=(
            "backend/src/Contigo.Identity.Workspace/Migrations/Scripts/identity-workspace.sql"
            "backend/src/Contigo.Documents.Contracts/Migrations/Scripts/documents-contracts.sql"
            "backend/src/Contigo.Audit/Migrations/Scripts/audit.sql"
            "backend/src/Contigo.Renewals/Migrations/Scripts/renewals.sql"
            "backend/src/Contigo.Savings/Migrations/Scripts/savings.sql"
            "backend/src/Contigo.Quotes/Migrations/Scripts/quotes.sql"
            "backend/src/Contigo.Chat/Migrations/Scripts/chat.sql"
            "backend/src/Contigo.Suppliers.Products/Migrations/Scripts/suppliers.sql"
            "backend/src/Contigo.Market/Migrations/Scripts/market.sql"
          )
          for script in "${SCRIPTS[@]}"; do
            if [ ! -f "$script" ]; then
              echo "::error::$script is missing -- ADR-021 requires all eight module scripts to be checked in"
              exit 1
            fi
            echo "::group::psql -f $script"
            psql -v ON_ERROR_STOP=1 -f "$script"
            echo "::endgroup::"
          done

      # "Prove contigo_<env> has the app tables (or fail the job)" (this
      # task's own coding objective): the table listing is the named,
      # human-readable check the Definition of Done asks for; the
      # migration_id comparison below is the strict pass/fail gate
      # ("...(or __EFMigrationsHistory rows)") -- it reads the *expected*
      # ids straight out of the same six checked-in files the step above
      # just applied, so it can never drift from what ADR-021 actually
      # ships.
      - name: Verify schema applied (ADR-021)
        run: |
          set -euo pipefail
          SCRIPTS=(
            "backend/src/Contigo.Identity.Workspace/Migrations/Scripts/identity-workspace.sql"
            "backend/src/Contigo.Documents.Contracts/Migrations/Scripts/documents-contracts.sql"
            "backend/src/Contigo.Audit/Migrations/Scripts/audit.sql"
            "backend/src/Contigo.Renewals/Migrations/Scripts/renewals.sql"
            "backend/src/Contigo.Savings/Migrations/Scripts/savings.sql"
            "backend/src/Contigo.Quotes/Migrations/Scripts/quotes.sql"
            "backend/src/Contigo.Chat/Migrations/Scripts/chat.sql"
            "backend/src/Contigo.Suppliers.Products/Migrations/Scripts/suppliers.sql"
            "backend/src/Contigo.Market/Migrations/Scripts/market.sql"
          )
          echo "::group::tables in contigo_${TARGET_ENVIRONMENT}"
          psql -Atqc "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"
          echo "::endgroup::"
          SCRIPT_ARGS=()
          for script in "${SCRIPTS[@]}"; do
            SCRIPT_ARGS+=(--script "$script")
          done
          psql -Atqc 'SELECT migration_id FROM "__EFMigrationsHistory" ORDER BY migration_id;' \
            | python3 scripts/schema_apply_verify.py "${SCRIPT_ARGS[@]}" --applied-ids-file -
